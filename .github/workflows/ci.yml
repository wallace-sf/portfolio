# GitHub Actions is currently disabled for this account (no billing), so this
# workflow does not run on push/PR. The real enforcement point is the local
# lefthook `pre-commit` hook (`pnpm format:check` / `lint:check` / `types:ci` /
# `test:ci`) and `pre-push` (`pnpm build`). `test:ci` runs every package's
# `test`, including `@repo/infra`'s unit tests; the infra *integration* suites
# (`*.integration.test.ts`) are opt-in via `pnpm --filter @repo/infra
# test:integration` and need a reachable database — see packages/infra/README.md.
# Kept here (dispatch-only) so CI is one billing toggle away from working.
name: CI

on:
  workflow_dispatch:

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '8.15.6'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm types:ci

      - name: Lint
        run: pnpm lint:check

      - name: Test
        run: pnpm test:ci
